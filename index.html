<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream chat overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* URL options:
     ?channel=name   channel (default bogdanthegdplayer)
     &max=6          max messages on screen (default 6)
     &fade=30        seconds before a message fades (default 30, 0 = never)
     &size=20        font size in px
     &bg=1           dark background (for testing in a browser)
     &mute=1         turn the cheer sound off
     &spam=0         turn the spam filter off
     &tts=0          turn !tts off
     &ttsvol=1       TTS volume 0-1
     &ttsvoice=name  pick a voice (part of its name, e.g. "zira")
     &drop=35        % chance a message earns 1 cookie
     &block=a,b      extra words blocked from TTS
     &sfxvol=0.8     TTS sound-effect volume 0-1
     &sfx=bruh,oof   extra (sfx) names; each plays <name>.mp3 from this folder
     &alerts=0       turn alerts off        &alertsec=6  seconds per alert
     &token=...&clientid=...   enables FOLLOW alerts (see notes)
     &alertpos=top   alerts as a top banner instead of in chat
     &wheelbias=1.2  wheel odds (higher = rarer big wins; 1.0 pays more than it costs)
     &ting=0         turn the "first message after a quiet minute" ting off
     &tingsec=60     how many quiet seconds before the ting
     &leadmod=name1,name2  show a LeadMod badge for these logins
     &silent=name1,name2   show a Silent badge for these logins
     &demo=1         show test buttons
     Commands:  !<currency> (e.g. !cookies)  !cheer <n>  !tts <text>  !<sfxname> (e.g. !meow)
                !mutesfx / !unmutesfx  (streamer + lead mods only; lead mods are set in the setup panel or with &leadmod=)  */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body.bg { background: #0e0e10; }
  #chat {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 12px 16px; box-sizing: border-box;
    font-family: "Roboto", Arial, "Helvetica Neue", sans-serif;
    font-size: var(--size, 20px); line-height: 1.35; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.8);
  }
  .msg {
    padding: 3px 0; word-wrap: break-word; overflow-wrap: anywhere;
    animation: in .25s ease-out both; transition: opacity .6s ease;
  }
  .msg.out { opacity: 0; }
  .name { font-weight: 700; }
  .name::after { content: ":"; color: #fff; font-weight: 400; margin-right: .35em; }
  .badges { display: inline-flex; flex-wrap: wrap; gap: 3px; margin-right: 5px; vertical-align: .12em; }
  .chat-badge {
    display: inline-block; padding: 1px 5px; border-radius: 3px;
    font: 700 .62em/1.45 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .025em; text-shadow: none; vertical-align: middle;
    color: #fff; background: #53535f;
  }
  .chat-badge.broadcaster { background: #9147ff; }
  .chat-badge.mod { background: #168a48; }
  .chat-badge.vip { background: #e85d9e; }
  .chat-badge.founder { background: #a35d27; }
  .chat-badge.sub { background: #3869c8; }
  .chat-badge.prime { background: #2865a8; }
  .chat-badge.leadmod { background: #b45309; }
  .chat-badge.silent { background: #60636b; }
  .chat-badge.custom { background: #6b4db8; }
  .native-badge { display: inline-block; width: 1.05em; height: 1.05em; vertical-align: -.16em; object-fit: contain; }
  .action .text { font-style: italic; }
  .emote { height: 1.5em; vertical-align: middle; margin: -.2em 1px; }

  /* Triangle cheer */
  .msg.cheer {
    margin: 4px 0; padding: 7px 11px; border-left: 3px solid #ffcf4a;
    border-radius: 6px; background: rgba(255,207,74,.13);
    animation: cheerIn .22s ease-out both;
  }
  .cheer .who { font-weight: 700; }
  .cheer .amt { font-weight: 800; color: #ffcf4a; }

  /* Cookie cards */
  .msg.cookie {
    margin: 5px 0; padding: 9px 14px; max-width: 360px;
    background: rgba(20,18,24,.92); border: 1px solid rgba(145,71,255,.32); border-radius: 9px;
    box-shadow: 0 6px 18px rgba(0,0,0,.35); text-shadow: none;
    animation: cheerIn .4s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .cookie .chead { font-weight: 700; }
  .cookie .cbig { font-size: 1.6em; font-weight: 800; color: #d5bfff; line-height: 1.15; margin-top: 2px; }
  .cookie .cbar { height: 7px; border-radius: 4px; background: rgba(255,255,255,.14); margin-top: 7px; overflow: hidden; }
  .cookie .cbar > div { height: 100%; background: linear-gradient(90deg,#9147ff,#c4a3ff); border-radius: 4px; }
  .cookie .chint { font-size: .72em; opacity: .75; margin-top: 4px; }
  .ui-icon { display: inline-block; width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.14em; flex: 0 0 auto; }
  .currency-icon { display: inline-block; width: 1.05em; height: 1.05em; color: #c4a3ff; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.16em; }
  .inline-currency { margin-left: 2px; }
  .big-currency { width: 1.05em; height: 1.05em; color: #ffd18a; }

  /* Minimal Twitch-inspired alerts */
  .msg.alertc {
    --ac: #9147ff;
    display: flex; align-items: center; gap: 10px;
    margin: 6px 0; padding: 9px 12px; box-sizing: border-box; max-width: 100%;
    border: 1px solid color-mix(in srgb, var(--ac) 48%, transparent);
    border-left: 3px solid var(--ac); border-radius: 9px;
    background: linear-gradient(105deg, color-mix(in srgb, var(--ac) 18%, #17131f), rgba(16,14,20,.82) 78%);
    box-shadow: 0 0 16px color-mix(in srgb, var(--ac) 15%, transparent);
    text-shadow: none; animation: cheerIn .22s ease-out both;
  }
  .alertc .ai, .alert .ai {
    display: grid; place-items: center; flex: 0 0 2.1em; width: 2.1em; height: 2.1em;
    box-sizing: border-box; border-radius: 8px; background: rgba(145,71,255,.12);
    border: 1px solid rgba(180,130,255,.32); color: #c4a3ff;
  }
  .alert-icon { width: 1.15em; height: 1.15em; stroke-width: 1.75; filter: drop-shadow(0 0 5px rgba(145,71,255,.3)); }
  .alertc .at { font-weight: 750; color: #fff; overflow-wrap: anywhere; }
  .alertc .as { font-size: .85em; color: #d5c9e7; opacity: .9; margin-top: 2px; white-space: pre-line; overflow-wrap: anywhere; }
  .alertc .as:empty { display: none; }

  #alerts {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; pointer-events: none; padding: 18px; box-sizing: border-box;
    font-family: "Roboto", Arial, "Helvetica Neue", sans-serif;
    font-size: var(--size, 20px); color: #fff;
  }
  .alert {
    --ac: #9147ff;
    position: relative; isolation: isolate; overflow: hidden;
    display: flex; align-items: center; gap: 13px; width: max-content; max-width: min(520px, 92%); box-sizing: border-box;
    padding: 13px 18px; border-radius: 12px;
    background: linear-gradient(110deg, rgba(36,23,54,.97), rgba(17,16,22,.96) 72%);
    color: #fff; border: 1px solid rgba(170,120,255,.42);
    box-shadow: 0 10px 34px rgba(0,0,0,.35), 0 0 22px rgba(145,71,255,.17), inset 0 1px 0 rgba(255,255,255,.06);
    animation: alertIn .28s cubic-bezier(.2,.8,.2,1) both;
    transition: opacity .35s ease, transform .35s ease;
  }
  .alert::before { content: ""; position: absolute; z-index: -1; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, #c9a5ff, #9147ff); box-shadow: 0 0 16px #9147ff; }
  .alert::after { content: ""; position: absolute; z-index: -1; width: 150px; height: 150px; right: -70px; top: -100px; border-radius: 50%; background: rgba(145,71,255,.17); filter: blur(25px); }
  .alert.out { opacity: 0; transform: translateY(-10px) scale(.985); }
  .alert .at { font-size: 1.08em; font-weight: 750; overflow-wrap: anywhere; }
  .alert .as { font-size: .82em; color: #d5c9e7; margin-top: 3px; overflow-wrap: anywhere; }
  @keyframes alertIn { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }

  #demo { position: fixed; right: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 280px; z-index: 20; }
  #demo button { font: 12px system-ui, sans-serif; padding: 4px 8px; cursor: pointer; }

  /* Small notices */
  .msg.note { font-size: .85em; opacity: .9; }

  /* TTS line */
  .msg.tts {
    margin: 4px 0; padding: 6px 12px;
    border-left: 3px solid #ffc46b; border-radius: 6px;
    background: linear-gradient(90deg, rgba(255,196,107,.2), rgba(255,196,107,0) 85%);
  }
  .tts .spk { margin-right: .35em; }

  #status {
    position: absolute; top: 8px; right: 12px; font: 12px system-ui, sans-serif;
    color: #9aa; opacity: 0; transition: opacity .4s; text-shadow: none;
  }
  #status.show { opacity: .8; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes cheerIn {
    from { opacity: 0; transform: translateX(-16px) scale(.96); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Setup dialog ---------- */
  #global-setup-backdrop {
    position: fixed; inset: 0; z-index: 100000; display: flex;
    align-items: center; justify-content: center; padding: 18px; box-sizing: border-box;
    background: rgba(8,8,10,.86); backdrop-filter: blur(3px);
    font: 14px/1.45 Inter, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    color: #e9e9ed; text-shadow: none;
  }
  #global-setup-backdrop.open { display: flex; }
  #global-setup-backdrop.closed { display: none; }
  #global-setup {
    position: relative; display: flex; flex-direction: column; overflow: hidden;
    width: min(620px, 100%); max-height: min(92vh, 880px); box-sizing: border-box;
    background: #171719; border: 1px solid #343438; border-radius: 12px;
    box-shadow: 0 18px 50px rgba(0,0,0,.4); animation: setupPanelIn .18s ease-out both;
  }
  .setup-head { padding: 20px 24px 14px; border-bottom: 1px solid #2a2a2e; }
  #global-setup h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; font-size: 19px; font-weight: 650; letter-spacing: -.02em; }
  .setup-live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #9147ff; }
  #global-setup .setup-note { margin: 0; color: #a5a5ad; font-size: 13px; line-height: 1.5; }
  #global-setup kbd { padding: 1px 5px; border: 1px solid #3f3f46; border-bottom-width: 2px; border-radius: 4px; background: #202024; font: 11px ui-monospace, Consolas, monospace; color: #d6d6dc; }

  .setup-body { padding: 4px 24px; overflow-y: hidden; flex: 1 1 auto; }
  .setup-section { padding: 16px 0; border-bottom: 1px solid #26262a; }
  .setup-section:last-child { border-bottom: 0; }
  .setup-section h3 { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 12px; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #9a9aa4; }
  #global-setup .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  #global-setup .span-2 { grid-column: 1 / -1; }
  #global-setup label { display: flex; flex-direction: column; gap: 5px; min-width: 0; color: #c9c9d0; font-size: 12px; font-weight: 550; }
  #global-setup label .opt { color: #7e7e88; font-weight: 400; }
  #global-setup .hint:empty { display: none; }
  #global-setup .hint { margin: 0; color: #84848e; font-size: 11.5px; font-weight: 400; line-height: 1.4; }
  #global-setup input:not([type=checkbox]), #global-setup select {
    box-sizing: border-box; width: 100%; min-width: 0; padding: 9px 11px;
    border: 1px solid #3a3a40; border-radius: 6px; background: #101012;
    color: #f2f2f4; font: inherit; outline: none; transition: border-color .12s ease, box-shadow .12s ease;
  }
  #global-setup input::placeholder { color: #5f5f68; }
  #global-setup input:focus, #global-setup select:focus { border-color: #a970ff; box-shadow: 0 0 0 3px rgba(145,71,255,.18); }
  #global-setup input[readonly] { color: #b9b9c2; background: #131316; cursor: text; }
  #global-setup .setup-check { flex-direction: row; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: #e2e2e7; cursor: pointer; }
  #global-setup .setup-check input { width: 16px; height: 16px; margin: 0; accent-color: #9147ff; }
  #global-setup .setup-checks { display: flex; flex-wrap: wrap; gap: 8px 22px; }
  #global-setup details { margin-top: 14px; border: 1px solid #2c2c31; border-radius: 8px; background: #141416; }
  #global-setup summary { padding: 9px 12px; cursor: pointer; font-size: 12px; font-weight: 600; color: #b4b4bd; user-select: none; }
  #global-setup details[open] summary { border-bottom: 1px solid #2c2c31; }
  #global-setup details .setup-grid { padding: 12px; }

  #global-setup button { border: 1px solid transparent; border-radius: 6px; padding: 9px 14px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600; transition: background .12s ease, border-color .12s ease, opacity .12s ease; }
  #global-setup button:disabled { opacity: .55; cursor: default; }
  #global-setup-save { background: #9147ff; color: #fff; }
  #global-setup-save:hover { background: #7d35e8; }
  #global-setup-cancel, #global-tts-test { background: #232326; border-color: #414146; color: #e8e8ec; }
  #global-setup-cancel:hover, #global-tts-test:hover:not(:disabled) { background: #2c2c30; }
  .setup-tts-test { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .setup-tts-test #global-setup-tts-status { flex: 1; min-height: 1.3em; font-size: 12px; color: #a5a5ad; }
  .setup-footer { display: flex; align-items: center; gap: 10px; padding: 14px 24px; border-top: 1px solid #2a2a2e; background: #141416; }
  #global-setup-status { flex: 1; min-height: 1.3em; margin: 0; font-size: 12px; color: #a5a5ad; }
  #global-setup-status.ok, #global-setup-tts-status.ok { color: #7ee2a8; }
  #global-setup-status.error, #global-setup-tts-status.error { color: #ff9a9a; }

  #setup-hint { position: fixed; z-index: 9999; top: 14px; left: 50%; transform: translate(-50%, -10px); padding: 9px 13px; border: 1px solid #393940; border-radius: 8px; background: #1a1a1d; color: #ededf0; font: 12px/1.4 "Segoe UI", sans-serif; opacity: 0; pointer-events: none; transition: opacity .22s ease, transform .22s ease; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  #setup-hint.show { opacity: 1; transform: translate(-50%, 0); }
  .msg.alertc { box-shadow: none; background: rgba(18,18,22,.94); border-color: color-mix(in srgb, var(--ac) 35%, #343438); }
  .alertc .ai, .alert .ai { background: #242229; border-color: #414047; }
  .alert-icon { filter: none; }
  .alert { background: #18181b; border-color: #393940; box-shadow: 0 12px 32px rgba(0,0,0,.3); }
  .alert::before { background: var(--ac); box-shadow: none; }
  .alert::after { display: none; }
  @keyframes setupPanelIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #global-setup, #setup-hint { animation: none !important; transition: none !important; } }
  @media (max-width: 520px) {
    #global-setup .setup-grid { grid-template-columns: 1fr; }
    .setup-head, .setup-footer { padding-left: 16px; padding-right: 16px; }
    .setup-body { padding: 2px 16px; }
    .setup-footer { flex-wrap: wrap; } #global-setup-status { flex-basis: 100%; }
  }

</style>
</head>

<div id="setup-hint" role="status">Saved. Press F2 to reopen setup.</div>
<div id="chat"></div>
<div id="alerts"></div>
<div id="status"></div>
<div id="global-setup-backdrop" role="dialog" aria-modal="true" aria-labelledby="global-setup-title">
  <section id="global-setup">
    <header class="setup-head">
      <h2 id="global-setup-title"><span class="setup-live-dot" aria-hidden="true"></span>Overlay setup</h2>
      <p class="setup-note">Saved in this browser. Press <kbd>F2</kbd> any time to reopen this panel.</p>
    </header>

    <div class="setup-body">
      <div class="setup-section">
        <h3>Twitch</h3>
        <div class="setup-grid">
          <label>Channel
            <input id="cfg-channel" autocomplete="off" placeholder="yourchannel">
          </label>
          <label><span>Overlay display name <span class="opt">(optional)</span></span>
            <input id="cfg-account" autocomplete="off" placeholder="My Stream">
          </label>
        </div>
      </div>

      <div class="setup-section">
        <h3>Currency</h3>
        <div class="setup-grid">
          <label>Name
            <input id="cfg-currency" autocomplete="off" placeholder="Cookies">
          </label>
          <label>Icon
            <select id="cfg-symbol">
              <option value="cookie">Cookie</option>
              <option value="money">Money</option>
              <option value="box">Box</option>
              <option value="moon">Moon</option>
              <option value="fries">Fries</option>
              <option value="heart">Heart</option>
            </select>
          </label>
          <p class="hint span-2" id="currency-cmd-hint"></p>
        </div>
      </div>

      <div class="setup-section">
        <h3>Text-to-speech</h3>
        <div class="setup-checks" style="margin-bottom:12px">
          <label class="setup-check"><input id="cfg-tts-enabled" type="checkbox" checked> Enable <code>!tts</code></label>
        </div>
        <p class="hint">Voice: Matthew (male, English US) via Puter.js.</p>
        <div class="setup-tts-test">
          <button id="global-tts-test" type="button">Test TTS</button>
          <span id="global-setup-tts-status" aria-live="polite"></span>
        </div>
      </div>

      <div class="setup-section">
        <h3>Overlay</h3>
        <div class="setup-checks">
          <label class="setup-check"><input id="cfg-alerts-enabled" type="checkbox" checked> Alerts</label>
          <label class="setup-check"><input id="cfg-chat-enabled" type="checkbox" checked> Chat</label>
        </div>
        <label style="margin-top:14px"><span>Lead moderators <span class="opt">(logins, comma separated)</span></span>
          <input id="cfg-leadmods" autocomplete="off" placeholder="mod1, mod2">
          <span class="hint">Lead mods and the streamer can use !mutesfx and !unmutesfx to silence every sound effect instantly.</span>
        </label>
        <label style="margin-top:14px"><span>Overlay link <span class="opt">(use this as your OBS browser source)</span></span>
          <input id="cfg-overlay-link" readonly onfocus="this.select()">
        </label>
      </div>
    </div>

    <footer class="setup-footer">
      <p id="global-setup-status" aria-live="polite"></p>
      <button id="global-setup-cancel" type="button">Close</button>
      <button id="global-setup-save" type="button">Save &amp; start</button>
    </footer>
  </section>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const ICON_ALIASES = { cookie: "cookie", money: "money", box: "box", moon: "moon", fries: "fries", heart: "heart", follow: "user-plus", raid: "users", sub: "star", gift: "gift", bits: "spark", hydrate: "water", request: "box", wheel: "dice", volume: "volume", alert: "bell" };
  function makeIcon(name, className = "ui-icon") {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("aria-hidden", "true"); svg.setAttribute("class", className);
    const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
    use.setAttribute("href", "#ico-" + (ICON_ALIASES[name] || name)); svg.appendChild(use); return svg;
  }
  function appendCurrencyIcon(parent, className = "currency-icon") { parent.appendChild(makeIcon(settings.symbol || "cookie", className)); }

  // "Gold Coins" -> "goldcoins": the currency name decides the balance command (!goldcoins / !goldcoin)
  const currencySlug = (name) => (String(name || "").toLowerCase().replace(/[^a-z0-9]/g, "")) || "cookies";
  const currencyCmds = (name) => {
    const slug = currencySlug(name), one = slug.replace(/s$/, "") || slug;
    return [...new Set([slug, one, one + "s"])].sort((a, b) => b.length - a.length);
  };

  const SETTINGS_KEY = "global-overlay-settings-v1";
  const defaultSettings = {
    channel: "", twitchClientId: "", twitchToken: "", account: "", currency: "Cookies", symbol: "cookie", ttsUrl: "", voice: "", apiKey: "", browserVoice: "", ttsEngine: "online", onlineVoice: "Matthew", leadMods: "",
    language: "en-US", tts: true, alerts: true, chat: true, configured: false
  };
  let settings = { ...defaultSettings };
  try { settings = { ...defaultSettings, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") }; } catch (e) {}
  if (!["cookie", "money", "box", "moon", "fries", "heart"].includes(settings.symbol)) settings.symbol = "cookie";
  const setupBackdrop = document.getElementById("global-setup-backdrop");
  const setupStatus = document.getElementById("global-setup-status");
  function setSetupStatus(msg, kind = "") { setupStatus.textContent = msg; setupStatus.className = kind; }
  const setupFields = {
    channel: "cfg-channel", account: "cfg-account", currency: "cfg-currency", symbol: "cfg-symbol", leadMods: "cfg-leadmods"
  };
  function fillSetup() {
    for (const [key, id] of Object.entries(setupFields)) {
      const field = document.getElementById(id);
      let value = settings[key] || "";
      if (key === "symbol" && !["cookie", "money", "box", "moon", "fries", "heart"].includes(value)) value = "cookie";
      field.value = value;
    }
    document.getElementById("cfg-tts-enabled").checked = !!settings.tts;
    document.getElementById("cfg-alerts-enabled").checked = !!settings.alerts;
    document.getElementById("cfg-chat-enabled").checked = !!settings.chat;
    document.getElementById("cfg-overlay-link").value = location.href.split("#")[0] + "#overlay";
    const adv = document.getElementById("cfg-tts-advanced"); if (adv && settings.ttsUrl) adv.open = true;
    updateCurrencyHint();
  }
  function openSetup() {
    fillSetup();
    setupBackdrop.classList.remove("closed");
    setupBackdrop.classList.add("open");
  }
  function closeSetup() {
    setupBackdrop.classList.remove("open");
    setupBackdrop.classList.add("closed");
  }
  fillSetup();
  function updateCurrencyHint() {
    const hint = document.getElementById("currency-cmd-hint");
    const input = document.getElementById("cfg-currency");
    if (!hint || !input) return;
    const name = input.value.trim() || "Cookies", slug = currencySlug(name);
    const others = currencyCmds(name).filter(c => c !== slug).map(c => "!" + c);
    hint.textContent = `Viewers check their balance with !${slug}${others.length ? " (also " + others.join(", ") + ")" : ""}.`;
  }
  document.getElementById("cfg-currency").addEventListener("input", updateCurrencyHint);


  const ttsStatus = document.getElementById("global-setup-tts-status");
  let ttsTestRun = 0;
  document.getElementById("global-tts-test").addEventListener("click", async () => {
    const button = document.getElementById("global-tts-test");
    const val = id => document.getElementById(id).value.trim();
    const cfg = { ...settings, strict: true, ttsUrl: "", ttsEngine: "online", onlineVoice: "Brian" };
    const run = ++ttsTestRun;
    const say = (msg, kind = "") => { if (run === ttsTestRun) { ttsStatus.textContent = msg; ttsStatus.className = kind; } };
    button.disabled = true;
    say("Testing voice…");
    ttsUnlock();                                   // this click counts as the user gesture the browser requires
    try {
      if (!cfg.ttsUrl && "speechSynthesis" in window && (speechSynthesis.speaking || speechSynthesis.pending)) {
        speechSynthesis.cancel();                  // clears a stuck engine before testing
        await new Promise(r => setTimeout(r, 200));
      }
      await speakText("TTS is working.", cfg);
      say("Finished. If you heard it, TTS is working.", "ok");
    } catch (e) {
      const why = e.code === "not-allowed" ? "the browser blocked audio. Click the page and try again."
        : e.code === "no-start" ? "the speech engine did not respond. This browser may have no voices."
        : (e.code === "audio-error" || e.code === "online-failed") ? (e.message || "could not reach the online voice. Check your internet connection.")
        : (e.message || e.code || "audio unavailable");
      say("TTS failed: " + why, "error");
    } finally {
      button.disabled = false;
    }
  });
  // Show setup by default. The overlay itself is only shown after saving to #overlay.
  // This prevents a previously saved browser setting from making the page look blank.
  if (location.hash.toLowerCase() === "#overlay") closeSetup();
  else openSetup();
  window.addEventListener("hashchange", () => {
    if (location.hash.toLowerCase() === "#overlay") closeSetup();
    else openSetup();
  });
  function leaveSetupRoute() {
    history.replaceState(null, "", location.pathname + location.search + "#overlay");
  }
  document.getElementById("global-setup-save").addEventListener("click", () => {
    for (const [key, id] of Object.entries(setupFields)) settings[key] = document.getElementById(id).value.trim();
    settings.channel = settings.channel.replace(/^#/, "").toLowerCase();
    settings.currency = settings.currency || "Cookies";
    settings.symbol = settings.symbol || "";
    settings.tts = document.getElementById("cfg-tts-enabled").checked;
    settings.alerts = document.getElementById("cfg-alerts-enabled").checked;
    settings.chat = document.getElementById("cfg-chat-enabled").checked;
    settings.language = settings.language || "en-US";
    settings.configured = true;
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
    catch (e) { setSetupStatus("Could not save settings in this browser.", "error"); return; }
    setSetupStatus("Saved. Loading your overlay…", "ok");
    try { sessionStorage.setItem("overlay-setup-saved-hint", "1"); } catch (e) {}
    leaveSetupRoute();
    location.reload();
  });
  document.getElementById("global-setup-cancel").addEventListener("click", () => {
    if (settings.configured) { leaveSetupRoute(); closeSetup(); }
    else setSetupStatus("Enter your channel and save to start the overlay.");
  });
  const CHANNEL = (settings.channel || params.get("channel") || "").toLowerCase().replace(/^#/, "");
  const CURRENCY_NAME = settings.currency || "Cookies";
  const CUR_CMDS = currencyCmds(CURRENCY_NAME);          // e.g. ["cookies", "cookie"]
  const DISPLAY_ACCOUNT = settings.account || CHANNEL;
  document.title = `${DISPLAY_ACCOUNT} chat overlay`;
  const LEADMOD_USERS = new Set(((params.get("leadmod") || "") + "," + (settings.leadMods || "")).toLowerCase().split(",").map(s => s.trim().replace(/^@/, "")).filter(Boolean));
  const SILENT_USERS = new Set((params.get("silent") || "").toLowerCase().split(",").map(s => s.trim()).filter(Boolean));
  const FADE_S  = parseFloat(params.get("fade") ?? "30");
  const MAX_MSG = Math.max(1, parseInt(params.get("max") || "6", 10));
  const MUTE    = params.get("mute") === "1";
  const SPAM_ON = params.get("spam") !== "0";
  const TTS_ON = settings.tts && params.get("tts") !== "0";
  const TTS_VOL = params.has("ttsvol") ? Math.min(1, Math.max(0, parseFloat(params.get("ttsvol")) || 0)) : 1;
  const TTS_VOICE = (params.get("ttsvoice") || "").toLowerCase();
  const DROP = (params.has("drop") ? Math.min(100, Math.max(0, parseFloat(params.get("drop")) || 0)) : 35) / 100;
  const EXTRA_BLOCK = (params.get("block") || "").toLowerCase().split(",").map(s => s.trim()).filter(Boolean);
  const TTS_COST = 10, TTS_MAX_CHARS = 150, TTS_QUEUE_MAX = 5, TTS_USER_CD = 10000;
  const ALERTS_ON = settings.alerts && params.get("alerts") !== "0";
  const ALERT_SEC = Math.max(2, parseFloat(params.get("alertsec")) || 6);
  const SFX_VOL = params.has("sfxvol") ? Math.min(1, Math.max(0, parseFloat(params.get("sfxvol")) || 0)) : 0.8;
  const EXTRA_SFX = (params.get("sfx") || "").toLowerCase().split(",").map(s => s.trim().replace(/[^a-z0-9_-]/g, "")).filter(Boolean);
  const TOKEN = settings.twitchToken || params.get("token") || "", CLIENT_ID = settings.twitchClientId || params.get("clientid") || "";
  const DEMO = params.get("demo") === "1";
  const ALERT_TOP = params.get("alertpos") === "top";
  const TING_ON = params.get("ting") !== "0";
  const TING_MS = (params.has("tingsec") ? Math.max(5, parseFloat(params.get("tingsec")) || 60) : 60) * 1000;
  const WHEEL_BIAS = params.has("wheelbias") ? Math.max(0.5, parseFloat(params.get("wheelbias")) || 1.2) : 1.2;
  const WHEEL_COST = 5, HYDRATE_COST = 20, REQUEST_COST = 5;
  if (params.get("size")) document.getElementById("chat").style.setProperty("--size", params.get("size") + "px");
  if (params.get("bg"))   document.body.classList.add("bg");

  const chat = document.getElementById("chat");
  if (!settings.chat) chat.style.display = "none";
  const statusEl = document.getElementById("status");
  const setStatus = (t) => { statusEl.textContent = t; statusEl.classList.toggle("show", !!t); };
  try {
    if (location.hash.toLowerCase() === "#overlay" && sessionStorage.getItem("overlay-setup-saved-hint") === "1") {
      sessionStorage.removeItem("overlay-setup-saved-hint");
      const hint = document.getElementById("setup-hint"); hint.classList.add("show");
      setTimeout(() => hint.classList.remove("show"), 6500);
    }
  } catch (e) {}

  /* ---------- Spam filter ---------- */
  const BOTS = new Set([
    "nightbot","streamelements","streamlabs","moobot","fossabot","wizebot","soundalerts",
    "commanderroot","anotherttvviewer","sery_bot","pokemoncommunitygame","drapsnatt"
  ]);
  const lastByUser = new Map();   // user -> { time, text }
  const recentText = [];          // { time, text } for copypasta detection

  function isSpam(user, tags, msg) {
    if (!SPAM_ON) return false;
    const now = Date.now();
    const text = msg.trim();
    const lower = text.toLowerCase();

    if (BOTS.has(user.toLowerCase())) return true;
    if (text.startsWith("!")) return true;                                  // bot commands
    if (text.length > 250) return true;                                     // walls of text
    if (/(https?:\/\/|www\.|\b[a-z0-9-]+\.(com|net|org|gg|tv|ly|io|xyz|ru|me)\b)/i.test(text)) return true; // links
    if (/(.)\1{11,}/u.test(text)) return true;                               // "aaaaaaaa"
    if (/(\b\S+\b)(\s+\1){5,}/i.test(lower)) return true;                   // same word again and again

    const letters = text.replace(/[^a-z]/gi, "");
    if (letters.length > 16 && letters.replace(/[^A-Z]/g, "").length / letters.length > 0.85) return true; // ALL CAPS

    const words = lower.split(/\s+/).filter(Boolean);
    if (words.length >= 8 && new Set(words).size / words.length < 0.3) return true; // low variety

    if (tags.emotes) {                                                      // emote spam
      const n = tags.emotes.split("/").reduce((a, e) => a + ((e.split(":")[1] || "").split(",").length), 0);
      if (n > 12) return true;
    }

    // per-user rate limit + exact duplicates
    const prev = lastByUser.get(user);
    if (prev) {
      if (now - prev.time < 800) return true;
      if (prev.text === lower && now - prev.time < 10000) return true;
    }
    lastByUser.set(user, { time: now, text: lower });

    // same message from many people (copypasta)
    while (recentText.length && now - recentText[0].time > 20000) recentText.shift();
    recentText.push({ time: now, text: lower });
    if (recentText.filter(r => r.text === lower).length >= 4) return true;

    return false;
  }

  /* ---------- Sound (soft, airy chime) ---------- */
  let ctx = null, lastSound = 0;
  function audio() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    return ctx;
  }
  // Every built-in sound goes through one bus so "!mutesfx" can silence them instantly.
  let sfxMuted = false, sfxBus = null;
  const sfxStops = new Set();
  function sfxOut(c) {
    if (!sfxBus || sfxBus.context !== c) { sfxBus = c.createGain(); sfxBus.connect(c.destination); }
    return sfxBus;
  }
  function stopAllSfx() {
    [...sfxStops].forEach(stop => { try { stop(); } catch (e) {} });
    sfxStops.clear();
    if (sfxBus) { try { sfxBus.disconnect(); } catch (e) {} sfxBus = null; }
  }
  function setSfxMuted(v) { sfxMuted = !!v; if (sfxMuted) stopAllSfx(); }

  // browsers need one click before sound; OBS browser sources don't
  addEventListener("pointerdown", audio, { once: true });

  function playCheer(amount) {
    if (MUTE || sfxMuted) return;
    const now = Date.now();
    if (now - lastSound < 600) return;       // don't stack sounds
    lastSound = now;
    const c = audio(); if (!c || c.state !== "running") return;

    const t0 = c.currentTime + 0.02;
    const master = c.createGain();
    master.gain.value = 0.22;

    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3200;
    master.connect(lp); lp.connect(sfxOut(c));

    // rising pentatonic arpeggio (E5 → G#5 → B5 → E6); bigger cheers add a top note
    const notes = [659.25, 830.61, 987.77, 1318.51];
    if (amount >= 500) notes.push(1661.22);
    notes.forEach((f, i) => {
      const t = t0 + i * 0.085;
      [[f, 1], [f * 2, 0.25]].forEach(([freq, vol]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = "sine"; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + 0.95);
      });
    });
  }

  /* ---------- Cookies ---------- */
  const STORE_KEY = "cookies:" + CHANNEL;
  let cookies = {};
  // Every fresh launch starts a new cookie season.
  try { localStorage.setItem(STORE_KEY, "{}"); } catch (e) {}
  const saveCookies = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(cookies)); } catch (e) {} };
  const bal = (u) => cookies[u.toLowerCase()] || 0;
  const addCookies = (u, n) => {
    const k = u.toLowerCase();
    cookies[k] = Math.max(0, (cookies[k] || 0) + n);
    saveCookies();
  };
  /* ---------- Twitch badges: the real images, no API key ---------- */
  // Badge art comes from Twitch's public badge feeds; the channel id comes from the chat messages themselves.
  const BADGE_TITLES = {
    broadcaster: "Broadcaster", moderator: "Moderator", vip: "VIP", founder: "Founder", subscriber: "Subscriber",
    premium: "Prime Gaming", staff: "Twitch Staff", admin: "Twitch Admin", global_mod: "Global Moderator",
    turbo: "Turbo", partner: "Verified", "sub-gifter": "Sub Gifter", "sub-gift-leader": "Gift Leader",
    bits: "Cheer", "bits-leader": "Bits Leader", "hype-train": "Hype Train", predictions: "Predictions"
  };
  const BADGE_CSS = { moderator: "mod", subscriber: "sub", premium: "prime" };
  const CORE_BADGES = new Set(["broadcaster", "moderator", "vip", "founder", "subscriber", "premium", "staff", "admin", "global_mod", "turbo", "partner"]);
  // Last-resort art for the common global badges (used only if the badge feeds can't be reached)
  const BADGE_BUILTIN = {
    broadcaster: "5527c58c-fb7d-422d-b71b-f309dcb85cc1", moderator: "3267646d-33f0-4b17-b3df-f923a41db1d0",
    vip: "b817aba4-fad8-49e2-b88a-7cc744dfa6ec", premium: "bbbe0db0-a598-423e-86d0-f9fb98ca1933",
    staff: "d97c37bd-a6f5-4c38-8f57-4e4bef88af34", admin: "9ef7e029-4cdf-4d4f-b4ed-11b98a8a7d76",
    global_mod: "9384c43e-4ce7-4e94-b2a1-b93656896eba", turbo: "bd444ec6-8f34-4bf9-91f4-af1e3428d80f",
    partner: "d12a2e27-16f6-41d0-ab77-b780518f00a3", founder: "511b78a9-ab37-472f-9569-457753bbe7d3"
  };
  const prettySet = (set) => set.replace(/[-_]+/g, " ").replace(/\b\w/g, c => c.toUpperCase());

  const badgeSets = new Map();                 // set -> Map(version -> { url, title })
  const pendingBadges = [];                    // badge elements waiting for art to load
  let channelBadgesDone = false, badgesTimedOut = false, globalBadgesStarted = false, channelBadgesStarted = false;

  function addBadgeVersion(set, version, url, title) {
    if (!set || !url) return;
    if (!badgeSets.has(set)) badgeSets.set(set, new Map());
    badgeSets.get(set).set(String(version), { url, title: title || BADGE_TITLES[set] || prettySet(set) });
  }
  function ingestBadges(data) {
    let n = 0;
    if (!data) return n;
    if (data.badge_sets) {                       // badges.twitch.tv format
      for (const [set, o] of Object.entries(data.badge_sets))
        for (const [ver, v] of Object.entries(o.versions || {})) { addBadgeVersion(set, ver, v.image_url_2x || v.image_url_1x, v.title); n++; }
    } else {                                     // list format { setID / set_id, versions: [{ id, ... }] }
      for (const sset of (Array.isArray(data) ? data : (data.data || data.badges || []))) {
        const set = sset.setID || sset.set_id;
        for (const v of (sset.versions || [])) { addBadgeVersion(set, v.id, v.image_url_2x || v.image_url_1x, v.title); n++; }
      }
    }
    return n;
  }
  async function fetchJson(url, ms = 7000) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
    try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
    finally { clearTimeout(t); }
  }
  async function loadFirst(urls) {
    for (const url of urls) {
      try { if (ingestBadges(await fetchJson(url))) return true; }
      catch (e) { console.warn("Badge source failed:", url, e.message); }
    }
    return false;
  }
  function loadOfficialTwitchBadges() {
    if (globalBadgesStarted) return;
    globalBadgesStarted = true;
    loadFirst(["https://badges.twitch.tv/v1/badges/global/display", "https://api.ivr.fi/v2/twitch/badges/global"]).then(refreshBadges);
    setTimeout(() => { badgesTimedOut = true; refreshBadges(); }, 9000);
  }
  function loadChannelBadges(roomId) {
    if (channelBadgesStarted || !roomId) return;
    channelBadgesStarted = true;
    loadFirst([`https://badges.twitch.tv/v1/badges/channels/${encodeURIComponent(roomId)}/display`,
               `https://api.ivr.fi/v2/twitch/badges/channel?login=${encodeURIComponent(CHANNEL)}`])
      .finally(() => { channelBadgesDone = true; refreshBadges(); });
  }

  // finds the picture for "set/version"; subscriber tiers fall back to the closest lower tier
  function findBadge(set, version) {
    const versions = badgeSets.get(set);
    if (versions) {
      if (versions.has(version)) return versions.get(version);
      const want = parseInt(version, 10);
      if (!isNaN(want)) {
        let best = null, bestN = -1;
        for (const [k, v] of versions) { const n = parseInt(k, 10); if (!isNaN(n) && n <= want && n > bestN) { best = v; bestN = n; } }
        if (best) return best;
      }
      if (versions.has("1")) return versions.get("1");
    }
    return BADGE_BUILTIN[set] ? { url: `https://static-cdn.jtvnw.net/badges/v1/${BADGE_BUILTIN[set]}/2`, title: BADGE_TITLES[set] } : null;
  }

  const badgeInfo = (tags, user) => {
    const login = (user || "").toLowerCase();
    const result = [], seen = new Set();
    (tags.badges || "").split(",").filter(Boolean).forEach(part => {
      const [set, version = "1"] = part.split("/");
      if (!set || seen.has(set)) return;
      seen.add(set);
      result.push({ key: BADGE_CSS[set] || set, set, version, title: BADGE_TITLES[set] || prettySet(set) });
    });
    if (tags.mod === "1" && !seen.has("moderator")) result.unshift({ key: "mod", set: "moderator", version: "1", title: "Moderator" });
    if (LEADMOD_USERS.has(login)) result.push({ custom: true, key: "leadmod", label: "LM", title: "Lead moderator" });
    if (SILENT_USERS.has(login)) result.push({ custom: true, key: "silent", label: "S", title: "Silent user" });
    return result;
  };

  function textBadge(span, info) {
    span.className = "chat-badge " + info.key;
    span.textContent = info.label || info.title;
    span.title = info.title;
    span.style.display = "";
  }
  // returns true when the badge is final (picture or text), false while it's still waiting for the art
  function fillBadge(span, info) {
    span.textContent = ""; span.className = ""; span.style.display = "";
    if (info.custom) { textBadge(span, info); return true; }
    const found = findBadge(info.set, info.version);
    if (found) {
      const img = document.createElement("img");
      img.className = "native-badge twitch-badge";
      img.alt = ""; img.title = found.title || info.title; img.src = found.url;
      img.onerror = () => { span.textContent = ""; if (CORE_BADGES.has(info.set)) textBadge(span, info); else span.style.display = "none"; };
      span.appendChild(img);
      return true;
    }
    if (!channelBadgesDone && !badgesTimedOut) { span.style.display = "none"; return false; }   // art still loading: stay invisible
    if (CORE_BADGES.has(info.set)) textBadge(span, info); else span.style.display = "none";
    return true;
  }
  function refreshBadges() {
    for (let i = pendingBadges.length - 1; i >= 0; i--) if (fillBadge(pendingBadges[i].span, pendingBadges[i].info)) pendingBadges.splice(i, 1);
  }

  const appendBadges = (parent, tags, user) => {
    const wrap = document.createElement("span");
    wrap.className = "badges";
    badgeInfo(tags, user).forEach(info => {
      const span = document.createElement("span");

  function chime(notes, step = 0.09, vol = 0.2) {
    if (MUTE || sfxMuted) return;
    const c = audio(); if (!c || c.state !== "running") return;
    const t0 = c.currentTime + 0.02;
    const master = c.createGain(); master.gain.value = vol;
    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3200;
    master.connect(lp); lp.connect(sfxOut(c));
    notes.forEach((f, i) => {
      const t = t0 + i * step;
      [[f, 1], [f * 2, 0.25]].forEach(([freq, v]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = "sine"; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(v, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + 0.95);
      });
    });
  }

  /* Follow alerts: Twitch doesn't send follows through chat, so this uses EventSub.
     It only runs if &token=...&clientid=... are in the URL. */
  function startFollows() {
    if (!TOKEN || !CLIENT_ID || !ALERTS_ON) return;
    const H = { "Authorization": "Bearer " + TOKEN, "Client-Id": CLIENT_ID };
    let ids = null, current = null, retry = 0;
    async function getIds() {
      if (ids) return ids;
      const [a, b] = await Promise.all([
        fetch("https://api.twitch.tv/helix/users?login=" + encodeURIComponent(CHANNEL), { headers: H }).then(r => r.json()),
        fetch("https://api.twitch.tv/helix/users", { headers: H }).then(r => r.json())
      ]);
      ids = { broadcaster: a.data[0].id, mod: b.data[0].id };
      return ids;
    }
    function open(url, isReconnect) {
      const ws = new WebSocket(url || "wss://eventsub.wss.twitch.tv/ws");
      current = ws;
      ws.onmessage = async (ev) => {
        let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
        const type = msg.metadata && msg.metadata.message_type;
        if (type === "session_welcome") {
          retry = 0;
          if (isReconnect) return;                           // subscriptions carry over on a reconnect
          try {
            const i = await getIds();
            const r = await fetch("https://api.twitch.tv/helix/eventsub/subscriptions", {
              method: "POST",
              headers: { ...H, "Content-Type": "application/json" },
              body: JSON.stringify({
                type: "channel.follow", version: "2",
                condition: { broadcaster_user_id: i.broadcaster, moderator_user_id: i.mod },
                transport: { method: "websocket", session_id: msg.payload.session.id }
              })
            });
            if (!r.ok) console.warn("follow alerts: subscribe failed", r.status, await r.text());
          } catch (e) { console.warn("follow alerts failed", e); }
        } else if (type === "session_reconnect") {
          open(msg.payload.session.reconnect_url, true);
        } else if (type === "notification" && msg.metadata.subscription_type === "channel.follow") {
          queueAlert("follow", `${msg.payload.event.user_name} just followed!`);
        }
      };
      ws.onclose = () => {
        if (ws !== current) return;
        setTimeout(() => open(), Math.min(1000 * 2 ** retry++, 30000));
      };
      ws.onerror = () => ws.close();
    }
    open();
  }

  /* ---------- SFX (used inside TTS) ---------- */
  const SFX_NAMES = new Set(["meow", "gunshot", "vineboom", "airhorns", ...EXTRA_SFX]);
  const SFX_MAX = 3;

  function noiseBuf(c, secs) {
    const b = c.createBuffer(1, Math.ceil(c.sampleRate * secs), c.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function env(g, t0, a, hold, rel, peak) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + a);
    g.gain.setValueAtTime(peak, t0 + a + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + hold + rel);
  }

  // Built-in sounds, used when there is no <name>.mp3 next to this file
  const SYNTH = {
    meow(c, out, t) {
      const o = c.createOscillator(); o.type = "sawtooth";
      o.frequency.setValueAtTime(420, t);
      o.frequency.linearRampToValueAtTime(760, t + 0.14);
      o.frequency.linearRampToValueAtTime(500, t + 0.6);
      const f = c.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 5;
      f.frequency.setValueAtTime(800, t);
      f.frequency.linearRampToValueAtTime(2000, t + 0.16);
      f.frequency.linearRampToValueAtTime(900, t + 0.62);
      const g = c.createGain(); env(g, t, 0.05, 0.35, 0.25, 0.9);
      o.connect(f); f.connect(g); g.connect(out);
      o.start(t); o.stop(t + 0.75);
      return 0.75;
    },
    gunshot(c, out, t) {
      const n = c.createBufferSource(); n.buffer = noiseBuf(c, 0.6);
      const f = c.createBiquadFilter(); f.type = "lowpass";
      f.frequency.setValueAtTime(7000, t);
      f.frequency.exponentialRampToValueAtTime(250, t + 0.4);
      const g = c.createGain();
      g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      n.connect(f); f.connect(g); g.connect(out); n.start(t);
      const o = c.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.18);
      const g2 = c.createGain();
      g2.gain.setValueAtTime(1, t); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      o.connect(g2); g2.connect(out); o.start(t); o.stop(t + 0.3);
      return 0.6;
    },
    vineboom(c, out, t) {
      const o = c.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(34, t + 0.9);
      const sh = c.createWaveShaper(); const curve = new Float32Array(256);
      for (let i = 0; i < 256; i++) curve[i] = Math.tanh((i / 128 - 1) * 3);
      sh.curve = curve;
      const g = c.createGain();
      g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
      o.connect(sh); sh.connect(g); g.connect(out); o.start(t); o.stop(t + 1.5);
      return 1.4;
    },
    airhorns(c, out, t) {
      [0, 0.75].forEach(off => {
        [440, 554.37, 659.25].forEach((fr, i) => {
          const o = c.createOscillator(); o.type = "sawtooth";
          o.frequency.value = fr * (1 + (i - 1) * 0.004);
          const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 2600;
          const g = c.createGain(); env(g, t + off, 0.03, 0.5, 0.15, 0.35);
          o.connect(f); f.connect(g); g.connect(out);
          o.start(t + off); o.stop(t + off + 0.8);
        });
      });
      return 1.6;
    }
  };

  // plays <name>.mp3 from this folder; if it's missing, uses the built-in sound (if there is one)
  function playSfx(name) {
    return new Promise(resolve => {
      if (SFX_VOL === 0 || sfxMuted) return resolve();
      let finished = false, started = false, fell = false, a = null;
      const done = () => { if (!finished) { finished = true; sfxStops.delete(stop); resolve(); } };
      const stop = () => { try { if (a) a.pause(); } catch (e) {} done(); };
      sfxStops.add(stop);
      const synth = () => {
        if (finished) return;
        const fn = SYNTH[name], c = audio();
        if (!fn || !c || c.state !== "running") return done();
        const out = c.createGain(); out.gain.value = 0.6 * SFX_VOL; out.connect(sfxOut(c));
        const dur = fn(c, out, c.currentTime + 0.02);
        setTimeout(done, dur * 1000 + 100);
      };
      const fallback = () => { if (fell) return; fell = true; started ? done() : synth(); };
      try { a = new Audio(name + ".mp3"); } catch (e) { return synth(); }
      a.volume = SFX_VOL;
      a.onended = done;
      a.onerror = fallback;
      a.play().then(() => { started = true; }).catch(fallback);
      setTimeout(() => { try { a.pause(); } catch (e) {} done(); }, 5000);   // never longer than 5s
    });
  }

  // !<sfxname> plays that sound; !mutesfx / !unmutesfx are for the streamer and lead mods only
  const SFX_CMD_COST = 0, SFX_CMD_CD = 8000;      // set SFX_CMD_COST above 0 to charge currency per sound
  const sfxCmdLast = new Map();
  let sfxGlobalLast = 0;
  function canControlSfx(tags, user) {
    const login = (user || "").toLowerCase();
    return /(^|,)broadcaster\//.test(tags.badges || "") || login === CHANNEL || LEADMOD_USERS.has(login);

  function sfxNotice(text, tags = {}, user = "") {

  function doSfxCmd(tags, user, name) {
    if (sfxMuted || MUTE || SFX_VOL === 0) return;
    const now = Date.now(), mod = isMod(tags);
    if (now - sfxGlobalLast < 1200) return;                                   // no pile-ups

  /* ---------- TTS ---------- */
  const BLOCK = ["nigg", "fagg", "retard", "killyourself", ...EXTRA_BLOCK];
  function ttsBlocked(t) {
    const flat = t.toLowerCase()
      .replace(/[0]/g, "o").replace(/[@4]/g, "a").replace(/[1!|]/g, "i").replace(/\$/g, "s").replace(/3/g, "e")
      .replace(/[^a-z ]/g, "");
    const tight = flat.replace(/\s+/g, "");
    return BLOCK.some(w => flat.includes(w) || tight.includes(w)) || /\bkys\b/.test(flat);
  }

  function stripEmotes(message, emoteTag) {
    if (!emoteTag) return message;
    const chars = Array.from(message);
    emoteTag.split("/").forEach(e => {
      (e.split(":")[1] || "").split(",").forEach(r => {
        const [s, en] = r.split("-").map(Number);
        if (!isNaN(s) && !isNaN(en)) for (let i = s; i <= en && i < chars.length; i++) chars[i] = "";
      });
    });
    return chars.join("");
  }

  function cleanTts(t) {
    return t.replace(/https?:\/\/\S+|www\.\S+/gi, "")
            .replace(/@\w+/g, "")
            .replace(/(.)\1{4,}/gu, "$1$1$1")
            .replace(/\s+/g, " ").trim()
            .slice(0, TTS_MAX_CHARS);
  }

  // "hello (meow) there" -> [say hello, sfx meow, say there]
  function parseSegments(text) {
    const segs = [];
    let last = 0, count = 0, m;
    const re = /\(([a-z0-9_-]+)\)/gi;
    while ((m = re.exec(text))) {
      const name = m[1].toLowerCase();
      if (!SFX_NAMES.has(name)) continue;
      if (m.index > last) segs.push({ say: text.slice(last, m.index) });
      if (count++ < SFX_MAX) segs.push({ sfx: name });
      last = m.index + m[0].length;
    }
    if (last < text.length) segs.push({ say: text.slice(last) });
    return segs.map(s => s.sfx ? s : { say: s.say.trim() }).filter(s => s.sfx || s.say);
  }

  // Browser voices load asynchronously. Wait briefly for them instead of speaking with none.
  let voicesPromise = null;
  function voicesReady() {
    if (!("speechSynthesis" in window)) return Promise.resolve([]);
    const have = speechSynthesis.getVoices();
    if (have.length) return Promise.resolve(have);
    if (!voicesPromise) voicesPromise = new Promise(resolve => {
      let timer;
      const finish = () => {
        clearTimeout(timer);
        speechSynthesis.removeEventListener("voiceschanged", finish);
        voicesPromise = null;
        resolve(speechSynthesis.getVoices());
      };
      timer = setTimeout(finish, 1500);
      speechSynthesis.addEventListener("voiceschanged", finish);
    });
    return voicesPromise;
  }

  // English voices only. Never inherit the OBS/browser language or choose a non-English voice.
  function pickVoice(voices, cfg = settings) {
    const en = voices.filter(v => /^en([_-]|$)/i.test(v.lang));
    const wanted = [TTS_VOICE, (cfg.browserVoice || "").toLowerCase()].filter(Boolean);
    for (const w of wanted) {
      const hit = en.find(v => v.name.toLowerCase() === w) || en.find(v => v.name.toLowerCase().includes(w));
      if (hit) return hit;
    }
    const lang = (cfg.language || "en-US").replace("_", "-").toLowerCase();
    const preferred = en.filter(v => v.lang.replace("_", "-").toLowerCase() === lang);
    const male = /(david|mark|guy|christopher|eric|tony|james|male)/i;
    return preferred.find(v => male.test(v.name)) || en.find(v => male.test(v.name)) || preferred[0] || en[0] || null;
  }

  const ttsQueue = [], ttsLastUser = new Map();
  let ttsBusy = false, ttsLocked = false;
  const liveUtterances = new Set();                 // Chrome drops "end" events for utterances that get garbage-collected, so keep a reference
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const ttsError = (message, code) => Object.assign(new Error(message), { code });

  async function speakWithBrowser(text, cfg = settings, attempt = 0) {
    if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
      throw ttsError("This browser does not support speech synthesis.", "unsupported");
    }
    const synth = window.speechSynthesis;
    const voices = await voicesReady();
    try {
      await new Promise((resolve, reject) => {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = cfg.language || "en-US";
        u.volume = TTS_VOL;
        const voice = pickVoice(voices, cfg);
        if (voice) { u.voice = voice; u.lang = voice.lang; }
        let done = false, startTimer, maxTimer;
        const finish = err => {
          if (done) return;
          done = true;
          clearTimeout(startTimer); clearTimeout(maxTimer);
          liveUtterances.delete(u);
          u.onstart = u.onend = u.onerror = null;
          err ? reject(err) : resolve();
        };
        u.onstart = () => clearTimeout(startTimer);
        u.onend = () => finish();
        u.onerror = e => finish(ttsError(`Browser TTS failed: ${e.error || "unknown error"}`, e.error));
        // Watchdogs: a speech engine that never starts or never finishes must not freeze the queue forever.
        startTimer = setTimeout(() => { synth.cancel(); finish(ttsError("The speech engine did not start.", "no-start")); }, 6000);
        maxTimer = setTimeout(() => { synth.cancel(); finish(); }, 8000 + text.length * 150);
        liveUtterances.add(u);
        synth.resume();
        synth.speak(u);
      });
    } catch (err) {
      // Chrome sometimes interrupts the first utterance after the engine wakes up; try once more.
      if (attempt < 1 && (err.code === "interrupted" || err.code === "no-start")) {
        await wait(250);
        return speakWithBrowser(text, cfg, attempt + 1);
      }
      throw err;
    }
  }

  // Plays an audio URL. Rejects with code "not-allowed" when the browser wants a click first.
  function playAudioUrl(url) {
    return new Promise((resolve, reject) => {
      const audio = new Audio();
      audio.preload = "auto";
      audio.volume = TTS_VOL;
      let done = false, startTimer, capTimer;
      const finish = err => {
        if (done) return;
        done = true;
        clearTimeout(startTimer); clearTimeout(capTimer);
        audio.onplaying = audio.onended = audio.onerror = null;
        try { audio.pause(); } catch (e) {}
        err ? reject(err) : resolve();
      };
      audio.onplaying = () => clearTimeout(startTimer);
      audio.onended = () => finish();
      audio.onerror = () => finish(ttsError("The voice audio could not be loaded.", "audio-error"));
      startTimer = setTimeout(() => finish(ttsError("The voice audio did not start.", "audio-error")), 10000);
      capTimer = setTimeout(() => finish(), 40000);          // never hold the queue longer than 40s
      audio.src = url;
      const p = audio.play();
      if (p && p.catch) p.catch(e => finish(e && e.name === "NotAllowedError"
        ? ttsError("Audio is blocked until the page is clicked.", "not-allowed")
        : ttsError((e && e.message) || "Audio could not play.", "audio-error")));
    });
  }

  // StreamElements hosted TTS: no account, API key, or local system voice required.
  // Brian is an English voice provided by the StreamElements speech endpoint.
  async function speakOnline(text, cfg = settings) {
    const url = "https://api.streamelements.com/kappa/v2/speech?voice=Brian&text=" + encodeURIComponent(text);
    await playAudioUrl(url);
  }

  // Optional custom endpoint from the setup panel (advanced)
  async function speakCustom(text, cfg) {
    const headers = { "Content-Type": "application/json", "Accept": "audio/mpeg, audio/wav, audio/*, application/json" };
    if (cfg.apiKey) headers.Authorization = `Bearer ${cfg.apiKey}`;
    const ctl = new AbortController();
    const abort = setTimeout(() => ctl.abort(), 12000);
    let response;
    try {
      response = await fetch(cfg.ttsUrl, {
        method: "POST", headers, mode: "cors", signal: ctl.signal,
        body: JSON.stringify({ text, voice: cfg.voice, language: cfg.language || "en-US", lang: cfg.language || "en-US" })
      });
    } finally { clearTimeout(abort); }
    if (!response.ok) throw new Error(`TTS service returned HTTP ${response.status}`);
    const type = (response.headers.get("content-type") || "").toLowerCase();
    let audioBlob;
    if (type.includes("application/json")) {
      const data = await response.json();
      if (data.audioUrl || data.audio_url || data.url) {
        const audioResponse = await fetch(data.audioUrl || data.audio_url || data.url);
        if (!audioResponse.ok) throw new Error("Could not load audio from the TTS service.");
        audioBlob = await audioResponse.blob();
      } else if (data.audioBase64 || data.audio_base64) {
        const raw = atob(data.audioBase64 || data.audio_base64);
        const bytes = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
        audioBlob = new Blob([bytes], { type: data.mimeType || data.mime_type || "audio/mpeg" });
      } else {
        throw new Error("TTS JSON must contain audioUrl or audioBase64.");
      }
    } else {
      audioBlob = await response.blob();
    }
    const audioUrl = URL.createObjectURL(audioBlob);
    try { await playAudioUrl(audioUrl); } finally { URL.revokeObjectURL(audioUrl); }
  }

  // Use the browser voice engine; prefer an English male voice when available.
  async function speakText(text, cfg = settings) {
    if (!text) return;
    await speakOnline(text, cfg);
  }

  async function runTts() {
    if (ttsBusy || ttsLocked || !ttsQueue.length) return;
    ttsBusy = true;
    const segs = ttsQueue.shift();
    let blocked = false;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      try {
        if (s.sfx) await playSfx(s.sfx); else await speakText(s.say);
      } catch (e) {
        if (e.code === "not-allowed") {             // browsers block speech until the page has been clicked once
          blocked = true;
          ttsQueue.unshift(segs.slice(i));          // keep the unspoken part so nothing is lost
          break;
        }
        console.error("TTS playback failed:", e);   // skip this piece and carry on with the rest
      }
    }
    ttsBusy = false;
    if (blocked) {
      ttsLocked = true;
      setStatus("Click anywhere on this page once to enable text-to-speech");
      return;
    }
    setTimeout(runTts, 120);
  }

  // Called on the first click/keypress: lets queued speech start if the browser had blocked it.
  function ttsUnlock() {
    if (!ttsLocked) return;
    ttsLocked = false;
    setStatus("");
    runTts();
  }
  addEventListener("pointerdown", ttsUnlock);
  addEventListener("keydown", ttsUnlock);

  function handleTts(tags, user, message) {
    if (!TTS_ON) return;
    const shown = cleanTts(stripEmotes(message, tags.emotes).replace(/^!tts\s*/i, ""));
    const text = stripCustomEmotes(shown);                  // custom emote names are shown in chat but never read aloud
    if (!text) return;

    // English only: ignore messages written mostly in other scripts (not charged)
    const letters = text.match(/\p{L}/gu) || [];
    const latin = text.match(/\p{Script=Latin}/gu) || [];
    if (letters.length && latin.length / letters.length < 0.7) return;

    const mod = isMod(tags);
    const have = bal(user);
    if (!mod && have < TTS_COST) { addCookieCard(tags, user, true); return; }
    if (ttsBlocked(text)) return;                           // blocked text is never charged
    if (ttsQueue.length >= TTS_QUEUE_MAX) return;           // queue full, not charged
    const segs = parseSegments(text);
    if (!segs.length) return;
    const now = Date.now();
    if (!mod) {
      if (now - (ttsLastUser.get(user) || 0) < TTS_USER_CD) return;
      addCookies(user, -TTS_COST);
      ttsLastUser.set(user, now);
    }

    const name = tags["display-name"] || user;
    const el = document.createElement("div");
    el.className = "msg tts";
    const spk = document.createElement("span"); spk.className = "spk"; spk.appendChild(makeIcon("volume", "ui-icon"));
    const n = document.createElement("span"); n.className = "name"; n.textContent = name;
    n.style.color = readable(tags.color, name);
    const t = document.createElement("span"); t.className = "text"; t.appendChild(emotifyText(shown));
    el.append(spk, n, t);
    push(el, tags);

    ttsQueue.push(segs);
    runTts();
  }

  /* ---------- Ting after a quiet minute ---------- */
  let lastMsgAt = Date.now();
  function ting() {
    if (MUTE || sfxMuted || !TING_ON) return;
    const c = audio(); if (!c || c.state !== "running") return;
    const t = c.currentTime + 0.01;
    const master = c.createGain(); master.gain.value = 0.14; master.connect(sfxOut(c));
    [[1760, 1], [2349.3, 0.35], [3520, 0.15]].forEach(([f, v]) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + 1.15);
    });
  }

  /* ---------- Rewards: !wheel !hydrate !request !gift, mod: !givecookies !requests !donerequest ---------- */
  const rewardCd = new Map();
  const cdLeft = (key, ms) => Date.now() - (rewardCd.get(key) || 0) < ms;
  const markCd = (key) => rewardCd.set(key, Date.now());
  const nameOf = (tags, user) => tags["display-name"] || user;
  function canPay(tags, user, cost, what) {
    if (isMod(tags)) return true;
    if (bal(user) < cost) { addCookieCard(tags, user, true, cost, what); return false; }
    return true;
  }
  const pay = (tags, user, cost) => { if (!isMod(tags)) addCookies(user, -cost); };

  // wheel: 1-20 cookies, small wins are more likely so it costs more than it pays on average
  const WHEEL_W = Array.from({ length: 20 }, (_, i) => 1 / Math.pow(i + 1, WHEEL_BIAS));
  const WHEEL_SUM = WHEEL_W.reduce((a, b) => a + b, 0);
  function spinWheel() {
    let r = Math.random() * WHEEL_SUM;
    for (let i = 0; i < 20; i++) { r -= WHEEL_W[i]; if (r <= 0) return i + 1; }
    return 1;
  }

  function doWheel(tags, user) {
    if (cdLeft("wheel:" + user, 8000)) return;
    if (!canPay(tags, user, WHEEL_COST, "the wheel")) return;
    const mod = isMod(tags), name = nameOf(tags, user);
    pay(tags, user, WHEEL_COST);
    const win = spinWheel();
    if (!mod) addCookies(user, win);
    markCd("wheel:" + user);
    const net = win - WHEEL_COST;
    const card = showAlertChat("wheel", `${name} spins the wheel...`, "Rolling...", 20, true);
    const tick = setInterval(() => { card.as.textContent = `${1 + Math.floor(Math.random() * 20)}`; }, 90);
    setTimeout(() => {
      clearInterval(tick);
      card.at.textContent = `${name} won ${win} ${CURRENCY_NAME}!`;
      card.as.textContent = mod ? "" : `${net >= 0 ? "+" : ""}${net} after the ${WHEEL_COST} ${CURRENCY_NAME} spin`;
      if (!MUTE) chime(win >= 15 ? [880, 1108.7, 1318.5, 1760, 2217] : win >= 8 ? [783.99, 987.77, 1174.66] : [659.25, 783.99]);
    }, 2200);
  }

  function doHydrate(tags, user) {
    if (cdLeft("hydrate", 45000)) return;
    if (!canPay(tags, user, HYDRATE_COST, "!hydrate")) return;
    pay(tags, user, HYDRATE_COST);
    markCd("hydrate");
    queueAlert("hydrate", `${nameOf(tags, user)} says: stay hydrated!`, "Time for a sip of water.", 30);
  }

  // level requests are saved so a mod can list them with !requests and clear one with !donerequest
  const REQ_KEY = "requests:" + CHANNEL;
  let requests = [];
  try { requests = JSON.parse(localStorage.getItem(REQ_KEY) || "[]") || []; } catch (e) { requests = []; }
  const saveReqs = () => { try { localStorage.setItem(REQ_KEY, JSON.stringify(requests)); } catch (e) {} };

  function doRequest(tags, user, arg) {
    const text = arg.replace(/https?:\/\/\S+|www\.\S+/gi, "").replace(/\s+/g, " ").trim().slice(0, 100);
    if (!text || ttsBlocked(text)) return;
    if (requests.length >= 20 || cdLeft("req:" + user, 30000)) return;     // not charged
    if (!canPay(tags, user, REQUEST_COST, "a level request")) return;
    pay(tags, user, REQUEST_COST);
    markCd("req:" + user);
    const name = nameOf(tags, user);
    requests.push({ user: name, text, t: Date.now() });
    saveReqs();
    queueAlert("request", `${name} requested a level`, text, 45);
  }

  function showRequests(tags) {
    if (!isMod(tags)) return;
    if (!requests.length) { queueAlert("request", "No pending level requests", "", 10); return; }
    const list = requests.slice(0, 5).map((r, i) => `${i + 1}. ${r.user}: ${r.text}`).join("\n");
    queueAlert("request", `${requests.length} pending request${requests.length === 1 ? "" : "s"}`, list, 20);
  }
  function doneRequest(tags) {
    if (!isMod(tags)) return;
    requests.shift();
    saveReqs();
    showRequests(tags);
  }

  const giftWindows = new Map();
  function giftLimit(user, now = Date.now()) {
    const key = user.toLowerCase();
    const windowMs = 300000;
    const limit = isMod(currentGiftTags) ? 10 : Infinity;
    const entries = (giftWindows.get(key) || []).filter(x => now - x.time < windowMs);
    return { entries, windowMs, limit, used: entries.reduce((sum, x) => sum + x.amount, 0) };
  }
  let currentGiftTags = {};
  function doGift(tags, user, arg) {
    const m = arg.match(/^@?(\w{1,25})\s+(\d{1,4})$/);
    if (!m) return;
    const to = m[1].toLowerCase(), n = parseInt(m[2], 10);
    if (n < 1 || to === user.toLowerCase() || cdLeft("gift:" + user, 3000)) return;
    currentGiftTags = tags;
    const limitInfo = giftLimit(user);
    if (limitInfo.used + n > limitInfo.limit) {
      queueAlert("cookie", `${nameOf(tags, user)} hit the currency gift limit`, "Moderators can gift up to 10 per 5 minutes.");
      return;
    }
    if (!canPay(tags, user, n, "that gift")) return;
    pay(tags, user, n);
    addCookies(to, n);
    const key = user.toLowerCase();
    giftWindows.set(key, [...limitInfo.entries, { time: Date.now(), amount: n }]);
    markCd("gift:" + user);
    queueAlert("cookie", `${nameOf(tags, user)} gifted ${n} ${CURRENCY_NAME} to ${m[1]}!`, "");
  }

  // mods/broadcaster only, completely silent: !give<currency> @name 20 (e.g. !givecookies)  (negative numbers take cookies away)
  function doGive(tags, arg) {
    if (!isMod(tags)) return;
    const m = arg.match(/^@?(\w{1,25})\s+(-?\d{1,6})$/);
    if (!m) return;
    addCookies(m[1], parseInt(m[2], 10));
    console.log("[cookies]", m[1], "now has", bal(m[1]));
  }

  function handleCommand(tags, user, message) {
    const cm = message.match(/^!([a-z0-9]+)(?:\s+(.*))?$/i);
    if (!cm) return false;
    const cmd = cm[1].toLowerCase(), arg = (cm[2] || "").trim();
    switch (cmd) {
      case "wheel":       doWheel(tags, user); return true;
      case "hydrate":     doHydrate(tags, user); return true;
      case "request":     doRequest(tags, user, arg); return true;
      case "gift":        doGift(tags, user, arg); return true;
      case "mutesfx":     doMuteSfx(tags, user, true); return true;
      case "unmutesfx":   doMuteSfx(tags, user, false); return true;
      case "requests":    showRequests(tags); return true;
      case "donerequest": doneRequest(tags); return true;
    }
    if (CUR_CMDS.some(c => cmd === "give" + c)) { doGive(tags, arg); return true; }    // !give<currency> @name 20
    if (SFX_NAMES.has(cmd)) { doSfxCmd(tags, user, cmd); return true; }              // !meow, !gunshot, ...
    return false;
  }

  /* ---------- Demo buttons (?demo=1) ---------- */
  if (DEMO) {
    const box = document.createElement("div");
    box.id = "demo";
    const modTags = { mod: "1", badges: "broadcaster/1", "display-name": "Demo" };
    const items = {
      "Follow":   () => queueAlert("follow", "SampleViewer just followed!"),
      "Raid":     () => queueAlert("raid", "SampleViewer is raiding with 42 viewers!"),
      "Sub":      () => queueAlert("sub", "SampleViewer just subscribed!", "Tier 1 · hello!"),
      "Resub":    () => queueAlert("sub", "SampleViewer resubscribed for 6 months!", "Tier 1"),
      "Gift":     () => queueAlert("gift", "SampleViewer gifted a sub to Friend!", "Tier 1"),
      "Mass gift":() => queueAlert("gift", "SampleViewer is gifting 5 subs!", "Tier 1"),
      "Bits":     () => queueAlert("bits", "SampleViewer cheered 100 bits!"),
      "Cheer cookies":() => addCheer({ "display-name": "SampleViewer" }, "sampleviewer", 50),
      "TTS+sfx":  () => handleTts(modTags, "demo", "!tts Hello there (meow) this is a test (vineboom) (gunshot) (airhorns)"),
      "Cookies":  () => { noteLast.clear(); addCookieCard({ "display-name": "SampleViewer" }, "sampleviewer", false); },
      "Short":    () => { noteLast.clear(); addCookieCard({ "display-name": "SampleViewer" }, "sampleviewer", true); },
      "Wheel":    () => { rewardCd.clear(); doWheel(modTags, "demo"); },
      "Hydrate":  () => { rewardCd.clear(); doHydrate(modTags, "demo"); },
      "Request":  () => { rewardCd.clear(); doRequest(modTags, "demo", "Bloodbath by Riot"); },
      "Gift":     () => { rewardCd.clear(); doGift(modTags, "demo", "@SampleViewer 5"); },
      "!meow":    () => { sfxGlobalLast = 0; doSfxCmd(modTags, "demo", "meow"); },
      "Mute sfx": () => doMuteSfx(modTags, "demo", !sfxMuted),
      "Ting":     () => ting()
    };
    Object.entries(items).forEach(([k, f]) => {
      const b = document.createElement("button");
      b.textContent = k;
      b.onclick = () => { audio(); f(); };
      box.append(b);
