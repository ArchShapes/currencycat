<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bogdanthegdplayer chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Options via URL:  ?channel=name  &fade=30 (seconds, 0 = never)  &size=20 (px)  &bg=1 (dark background) */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body.bg { background: #0e0e10; }
  #chat {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 12px 16px; box-sizing: border-box;
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: var(--size, 20px); line-height: 1.35; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.8);
  }
  .msg {
    padding: 3px 0; word-wrap: break-word; overflow-wrap: anywhere;
    animation: in .25s ease-out both; transition: opacity .6s ease;
  }
  .msg.out { opacity: 0; }
  .name { font-weight: 700; }
  .name::after { content: ":"; color: #fff; font-weight: 400; margin-right: .35em; }
  .action .text { font-style: italic; }
  .emote { height: 1.5em; vertical-align: middle; margin: -.2em 1px; }
  #status {
    position: absolute; top: 8px; right: 12px; font: 12px system-ui, sans-serif;
    color: #9aa; opacity: .0; transition: opacity .4s; text-shadow: none;
  }
  #status.show { opacity: .8; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="chat"></div>
<div id="status"></div>

<script>
(() => {
  const params  = new URLSearchParams(location.search);
  const CHANNEL = (params.get("channel") || "bogdanthegdplayer").toLowerCase().replace(/^#/, "");
  const FADE_S  = parseFloat(params.get("fade") ?? "0");   // seconds before a message fades out (0 = stay)
  const MAX_MSG = 40;                                       // max messages kept on screen
  if (params.get("size")) document.getElementById("chat").style.setProperty("--size", params.get("size") + "px");
  if (params.get("bg"))   document.body.classList.add("bg");

  const chat = document.getElementById("chat");
  const statusEl = document.getElementById("status");
  const setStatus = (t) => { statusEl.textContent = t; statusEl.classList.toggle("show", !!t); };

  // Make dark usernames readable on dark / transparent backgrounds
  function readable(hex, name) {
    if (!/^#[0-9a-f]{6}$/i.test(hex || "")) {
      let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      return `hsl(${h % 360} 70% 65%)`;
    }
    let [r, g, b] = [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16));
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    if (lum < 0.45) { const k = 0.45; r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }
    return `rgb(${r | 0},${g | 0},${b | 0})`;
  }

  function parseTags(raw) {
    const out = {};
    raw.split(";").forEach(p => { const i = p.indexOf("="); out[p.slice(0, i)] = p.slice(i + 1); });
    return out;
  }

  function buildText(message, emoteTag) {
    const frag = document.createDocumentFragment();
    const chars = Array.from(message);               // code-point safe, matches Twitch indices
    const ranges = [];
    if (emoteTag) {
      emoteTag.split("/").forEach(e => {
        const [id, pos] = e.split(":");
        (pos || "").split(",").forEach(r => {
          const [s, en] = r.split("-").map(Number);
          if (!isNaN(s) && !isNaN(en)) ranges.push({ s, e: en, id });
        });
      });
      ranges.sort((a, b) => a.s - b.s);
    }
    let cur = 0;
    const text = (a, b) => { if (b > a) frag.appendChild(document.createTextNode(chars.slice(a, b).join(""))); };
    for (const r of ranges) {
      text(cur, r.s);
      const img = document.createElement("img");
      img.className = "emote";
      img.alt = chars.slice(r.s, r.e + 1).join("");
      img.src = `https://static-cdn.jtvnw.net/emoticons/v2/${r.id}/default/dark/2.0`;
      frag.appendChild(img);
      cur = r.e + 1;
    }
    text(cur, chars.length);
    return frag;
  }

  function addMessage(tags, user, message) {
    let isAction = false;
    const m = message.match(/^\x01ACTION (.*)\x01$/);
    if (m) { isAction = true; message = m[1]; }

    const name = tags["display-name"] || user;
    const el = document.createElement("div");
    el.className = "msg" + (isAction ? " action" : "");
    if (tags.id) el.dataset.id = tags.id;

    const n = document.createElement("span");
    n.className = "name";
    n.textContent = name;
    n.style.color = readable(tags.color, name);

    const t = document.createElement("span");
    t.className = "text";
    t.appendChild(buildText(message, tags.emotes));

    el.append(n, t);
    chat.appendChild(el);

    while (chat.children.length > MAX_MSG) chat.removeChild(chat.firstChild);

    if (FADE_S > 0) {
      setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 700); }, FADE_S * 1000);
    }
  }

  function removeBy(sel) { chat.querySelectorAll(sel).forEach(e => e.remove()); }

  let ws, retry = 0;
  function connect() {
    setStatus("connecting…");
    ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");

    ws.onopen = () => {
      ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
      ws.send("PASS SCHMOOPIIE");
      ws.send("NICK justinfan" + Math.floor(10000 + Math.random() * 89999));
      ws.send("JOIN #" + CHANNEL);
    };

    ws.onmessage = (ev) => {
      ev.data.split("\r\n").filter(Boolean).forEach(line => {
        let tags = {}, rest = line;
        if (rest[0] === "@") { const i = rest.indexOf(" "); tags = parseTags(rest.slice(1, i)); rest = rest.slice(i + 1); }

        if (rest.startsWith("PING")) { ws.send("PONG :tmi.twitch.tv"); return; }

        const parts = rest.match(/^:([^!]+)![^ ]+ PRIVMSG #[^ ]+ :(.*)$/);
        if (parts) { addMessage(tags, parts[1], parts[2]); return; }

        if (/ JOIN #/.test(rest) && rest.startsWith(":justinfan")) { retry = 0; setStatus(""); return; }

        if (/ CLEARMSG /.test(rest) && tags["target-msg-id"]) { removeBy(`[data-id="${tags["target-msg-id"]}"]`); return; }
        if (/ CLEARCHAT /.test(rest)) {
          const target = rest.split(":").pop();
          if (rest.match(/CLEARCHAT #[^ ]+ :/)) {
            chat.querySelectorAll(".msg").forEach(e => {
              if (e.querySelector(".name").textContent.toLowerCase() === target.toLowerCase()) e.remove();
            });
          } else chat.innerHTML = "";
        }
      });
    };

    ws.onclose = () => {
      setStatus("reconnecting…");
      setTimeout(connect, Math.min(1000 * 2 ** retry++, 15000));
    };
    ws.onerror = () => ws.close();
  }

  connect();
})();
</script>
</body>
</html>
