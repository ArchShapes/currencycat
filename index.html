    document.body.append(box);
  }

  /* ---------- Rendering ---------- */
  function readable(hex, name) {
    if (!/^#[0-9a-f]{6}$/i.test(hex || "")) {
      let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      return `hsl(${h % 360} 70% 65%)`;
    }
    let [r, g, b] = [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16));
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    if (lum < 0.45) { const k = 0.45; r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }
    return `rgb(${r | 0},${g | 0},${b | 0})`;
  }

  function unesc(v) {
    return v.replace(/\\(.)/g, (m, c) => ({ s: " ", ":": ";", "\\": "\\", r: "\r", n: "\n" }[c] ?? c));
  }
  function parseTags(raw) {
    const out = {};
    raw.split(";").forEach(p => { const i = p.indexOf("="); out[p.slice(0, i)] = unesc(p.slice(i + 1)); });
    return out;
  }

  // Custom emotes: the word (any capitalization) is replaced by the image next to this file.
  const CUSTOM_EMOTES = { ww: "ww.png", ll: "ll.png", normalface: "normalface.png", son: "son.png" };
  const EMOTE_WORD = /^([^\p{L}\p{N}]*)([\p{L}\p{N}_]+)([^\p{L}\p{N}]*)$/u;
  const customEmoteOf = (word) => { const m = word.match(EMOTE_WORD); return m && CUSTOM_EMOTES[m[2].toLowerCase()] ? { m, file: CUSTOM_EMOTES[m[2].toLowerCase()] } : null; };
  function emotifyText(str) {
    const frag = document.createDocumentFragment();
    let buf = "";
    const flush = () => { if (buf) { frag.appendChild(document.createTextNode(buf)); buf = ""; } };
    for (const part of String(str).split(/(\s+)/)) {
      const hit = customEmoteOf(part);
      if (!hit) { buf += part; continue; }
      buf += hit.m[1]; flush();
      const img = document.createElement("img");
      img.className = "emote custom-emote";
      img.src = hit.file; img.alt = hit.m[2]; img.title = hit.m[2];
      img.onerror = () => img.replaceWith(document.createTextNode(hit.m[2]));   // image missing: show the plain word
      frag.appendChild(img);
      buf = hit.m[3];
    }
    flush();
    return frag;
  }
  function stripCustomEmotes(str) {
    return String(str).split(/(\s+)/).map(part => customEmoteOf(part) ? "" : part).join("").replace(/\s+/g, " ").trim();
  }

  function buildText(message, emoteTag) {
    const frag = document.createDocumentFragment();
    const chars = Array.from(message);
    const ranges = [];
    if (emoteTag) {
      emoteTag.split("/").forEach(e => {
        const [id, pos] = e.split(":");
        (pos || "").split(",").forEach(r => {
          const [s, en] = r.split("-").map(Number);
          if (!isNaN(s) && !isNaN(en)) ranges.push({ s, e: en, id });
        });
      });
      ranges.sort((a, b) => a.s - b.s);
    }
    let cur = 0;
    const text = (a, b) => { if (b > a) frag.appendChild(emotifyText(chars.slice(a, b).join(""))); };
    for (const r of ranges) {
      text(cur, r.s);
      const img = document.createElement("img");
      img.className = "emote";
      img.alt = chars.slice(r.s, r.e + 1).join("");
      img.src = `https://static-cdn.jtvnw.net/emoticons/v2/${r.id}/default/dark/2.0`;
      frag.appendChild(img);
      cur = r.e + 1;
    }
    text(cur, chars.length);
    return frag;
  }

  function push(el, tags, fade = FADE_S) {
    if (tags.id) el.dataset.id = tags.id;
    chat.appendChild(el);
    const all = [...chat.children];
    const norm = all.filter(e => !e.classList.contains("keep"));
    const keep = all.filter(e => e.classList.contains("keep"));
    while (norm.length > MAX_MSG) norm.shift().remove();
    while (keep.length > 4) keep.shift().remove();
    if (fade > 0) {
      setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 700); }, fade * 1000);
    }
  }

  // !cheer 100 or !cheer<currency> 100 (e.g. !cheercookies 100)
  const CHEER_RE = new RegExp("^\\s*(?:" + [...CUR_CMDS.map(c => "!cheer" + c), "!cheer"].join("|") + ")\\s+(\\d{1,3}(?:,\\d{3})+|\\d{1,9})\\s*$", "i");
  const activeChatters = new Map();

  function addCheer(tags, user, amount) {
    const name = tags["display-name"] || user;
    const now = Date.now();
    activeChatters.set(user.toLowerCase(), { name, seen: now });
    const recipients = [...activeChatters.entries()]
      .filter(([login, info]) => login !== user.toLowerCase() && now - info.seen < 10 * 60 * 1000)
      .map(([login]) => login);
    const pool = recipients.length ? recipients : [user.toLowerCase()];
    const each = Math.floor(amount / pool.length);
    const remainder = amount % pool.length;
    pool.forEach((login, i) => addCookies(login, each + (i < remainder ? 1 : 0)));

    const el = document.createElement("div");
    el.className = "msg cheer";
    const who = document.createElement("span"); who.className = "who"; who.textContent = name;
    who.style.color = readable(tags.color, name);
    const amt = document.createElement("span"); amt.className = "amt"; appendCurrencyIcon(amt, "currency-icon"); amt.append(document.createTextNode(" " + amount.toLocaleString("en-US")));
    el.append(who, document.createTextNode(" cheered "), amt,
      document.createTextNode(` ${CURRENCY_NAME}. Shared across ${pool.length} ${pool.length === 1 ? "viewer" : "viewers"}!`));
    push(el, tags);
    playCheer(amount);
  }

  function addMessage(tags, user, message) {
    let isAction = false;
    const m = message.match(/^\x01ACTION (.*)\x01$/);
    if (m) { isAction = true; message = m[1]; }

    const nowMs = Date.now();
    const wasSilent = nowMs - lastMsgAt >= TING_MS;
    lastMsgAt = nowMs;

    if (tags.bits && /^\d+$/.test(tags.bits)) {
      queueAlert("bits", `${tags["display-name"] || user} cheered ${Number(tags.bits).toLocaleString("en-US")} bits!`);
    }

    // commands and cheers (checked before the spam filter, which drops other "!" messages)
    if (!isAction) {
      activeChatters.set(user.toLowerCase(), { name: tags["display-name"] || user, seen: Date.now() });
      const c = message.match(CHEER_RE);
      if (c) { tryCheer(tags, user, c[1]); return; }
      if (/^!tts(\s|$)/i.test(message)) { handleTts(tags, user, message); return; }
      { const bm = message.match(/^!([a-z0-9]+)\s*$/i); if (bm && CUR_CMDS.includes(bm[1].toLowerCase())) { showBalance(tags, user); return; } }
      if (handleCommand(tags, user, message)) return;
    }

    // bots never show; mods always do; everyone else goes through the spam filter
    if (BOTS.has(user.toLowerCase())) return;
    if (!isMod(tags) && isSpam(user, tags, message)) return;

    // only messages that pass the spam filter can earn a cookie (mods don't need them)
    if (!isMod(tags) && Math.random() < DROP) addCookies(user, 1);
    if (wasSilent) ting();

    const displayName = tags["display-name"] || user;
    const name = displayName;
    const el = document.createElement("div");
    el.className = "msg" + (isAction ? " action" : "");

    const n = document.createElement("span");
    n.className = "name";
    n.textContent = name;
    n.style.color = readable(tags.color, displayName);

    const t = document.createElement("span");
    t.className = "text";
    t.appendChild(buildText(message, tags.emotes));

    appendBadges(el, tags, user);
    el.append(n, t);
    push(el, tags);
  }

  function removeBy(sel) { chat.querySelectorAll(sel).forEach(e => e.remove()); }

  /* ---------- Chat platform connections ---------- */
  let ws, retry = 0;
  function connect() {
    connectTwitch();
    loadOfficialTwitchBadges();
  }

  function connectTwitch() {
    if (!CHANNEL) {
      console.info("Twitch channel is not configured; enter it in the setup panel (F2).");
      return;
    }
    setStatus("connecting to Twitch…");
    ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");

    ws.onopen = () => {
      ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
      ws.send("PASS SCHMOOPIIE");
      ws.send("NICK justinfan" + Math.floor(10000 + Math.random() * 89999));
      ws.send("JOIN #" + CHANNEL);
    };

    ws.onmessage = (ev) => {
      ev.data.split("\r\n").filter(Boolean).forEach(line => {
        let tags = {}, rest = line;
        if (rest[0] === "@") { const i = rest.indexOf(" "); tags = parseTags(rest.slice(1, i)); rest = rest.slice(i + 1); }

        if (rest.startsWith("PING")) { ws.send("PONG :tmi.twitch.tv"); return; }

        const un = rest.match(/^:tmi\.twitch\.tv USERNOTICE #[^ ]+(?: :(.*))?$/);
        if (un) { handleUserNotice(tags, un[1] || ""); return; }

        const parts = rest.match(/^:([^!]+)![^ ]+ PRIVMSG #[^ ]+ :(.*)$/);
        if (parts) { loadChannelBadges(tags["room-id"]); addMessage(tags, parts[1], parts[2]); return; }

        if (/ JOIN #/.test(rest) && rest.startsWith(":justinfan")) { retry = 0; setStatus(""); return; }

        if (/ CLEARMSG /.test(rest) && tags["target-msg-id"]) { removeBy(`[data-id="${tags["target-msg-id"]}"]`); return; }
        if (/ CLEARCHAT /.test(rest)) {
          if (/CLEARCHAT #[^ ]+ :/.test(rest)) {
            const target = rest.split(":").pop().toLowerCase();
            chat.querySelectorAll(".msg").forEach(e => {
              const n = e.querySelector(".name, .who");
              if (n && n.textContent.toLowerCase() === target) e.remove();
            });
          } else chat.innerHTML = "";
        }
      });
    };

    ws.onclose = () => {
      setStatus("reconnecting…");
      setTimeout(connect, Math.min(1000 * 2 ** retry++, 15000));
    };
    ws.onerror = () => ws.close();
  }

  if (settings.configured) {
    connect();
    startFollows();
  }

  document.addEventListener("keydown", (event) => {
    if (event.repeat || /INPUT|TEXTAREA|SELECT/.test(event.target.tagName) || event.target.isContentEditable) return;
    if (event.key.toLowerCase() === "e") {
      settings.language = "en-US";
      try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
      if (setupStatus) setSetupStatus("TTS language set to English (US).", "ok");
      console.info("TTS language set to English (US).");
    } else if (event.key === "F2") {
      event.preventDefault();
      openSetup();
    }
  });

})();
</script>
